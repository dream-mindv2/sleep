# sleep: a terminal written in Dream. `mind run --desktop` opens it.
[package]
license = "MIT OR Apache-2.0"
name = "sleep"
version = "0.1.1"
entry = "frontend.dr"
description = "A terminal written in Dream: tabs, HTTP and database tabs, and an assistant that learns from your history"
repository = "https://github.com/dream-mindv2/sleep"

# The frontend is the window, on the browser VM; the backend is native and
# owns the shells, the network and the databases.
[graphics]
frontend = "src/frontend.dr"
backend = "src/backend.dr"
js = ["web/sleep.mjs"]

# The C libraries sleep needs where it runs: SQLite for the database tabs and
# WebKitGTK for its window. mind warns when either is not found.
[system]
sqlite3 = { version = "0", apt = "libsqlite3-0", dnf = "sqlite-libs", pacman = "sqlite", zypper = "libsqlite3-0", brew = "sqlite", nix = "sqlite" }
"webkit2gtk-4.1" = { version = "0", apt = "libwebkit2gtk-4.1-0", dnf = "webkit2gtk4.1", pacman = "webkit2gtk-4.1", zypper = "libwebkit2gtk-4_1-0", nix = "webkitgtk_4_1" }
